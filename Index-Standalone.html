<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Gate 🔐</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic','Segoe UI',system-ui}
body{min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#fff;overflow:hidden;padding:20px}
.bg-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px at 50% -10%, rgba(180,255,57,0.15), transparent),radial-gradient(800px at 90% 90%, rgba(125,255,92,0.08), transparent)}
.card,.chat{width:100%;max-width:420px;background:rgba(18,21,29,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06)}
.card{padding:32px 28px;text-align:center;animation:fadeIn .5s ease}
.logo{width:72px;height:72px;margin:0 auto 16px;display:grid;place-items:center;font-size:32px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:20px}
h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.card p{color:rgba(255,255,255,0.5);font-size:13px;margin:8px 0 22px}
input{width:100%;height:46px;background:#0f1218;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:0 14px;color:#fff;font-size:14px;outline:none;transition:.2s;margin-bottom:12px}
input:focus{border-color:rgba(180,255,57,0.35);background:#151a24}
.secret-wrap{position:relative}
#toggleSecret{position:absolute;left:8px;top:6px;height:34px;width:34px;border-radius:8px;border:0;background:rgba(255,255,255,0.06);cursor:pointer}
#enter{width:100%;height:46px;border-radius:12px;border:0;background:#b4ff39;color:#000;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 0 24px rgba(180,255,57,0.3);transition:.2s;margin-top:4px}
#enter:hover{background:#c6ff5c}
#enter:disabled{opacity:.5;cursor:not-allowed}
small{display:block;margin-top:14px;color:rgba(255,255,255,0.3);font-size:11px;line-height:1.6}
#error{margin-top:12px;font-size:12px;color:#ff6b6b;min-height:16px}
.hidden{display:none!important}
.chat{max-width:680px;height:min(84vh,720px);display:flex;flex-direction:column;overflow:hidden}
.chat.hidden{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(15,18,24,0.8)}
header strong{font-size:14px}
#status{font-size:11px;margin-right:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6)}
#status.online{background:rgba(180,255,57,0.15);color:#b4ff39}
#room{font-size:10px;color:rgba(255,255,255,0.25);margin-right:6px}
.ghost{height:32px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);cursor:pointer}
#messages{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;animation:fadeIn .25s ease}
.msg.me{align-self:flex-end;background:#b4ff39;color:#000;border-bottom-right-radius:6px}
.msg.other{align-self:flex-start;background:#1a1f2b;border:1px solid rgba(255,255,255,0.07);border-bottom-left-radius:6px;color:#fff}
.msg.system{align-self:center;background:rgba(255,255,255,0.06);font-size:11px;color:rgba(255,255,255,0.5);border-radius:20px;padding:6px 12px}
.meta{font-size:10px;opacity:.6;margin-bottom:2px;display:flex;gap:6px}
#sendForm{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(15,18,24,0.9)}
#sendForm input{margin:0;flex:1}
#sendForm button{height:46px;min-width:86px;border-radius:12px;border:0;background:#b4ff39;color:#000;font-weight:800;cursor:pointer}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card" id="login">
  <div class="logo">🔐</div>
  <h1>Private Gate</h1>
  <p>بوابة محادثة خاصة بين شخصين</p>
  <input id="name" maxlength="40" placeholder="اسمك" autocomplete="name">
  <div class="secret-wrap">
    <input id="secret" type="password" placeholder="كلمة السر المشتركة">
    <button id="toggleSecret" type="button">👁️</button>
  </div>
  <button id="enter">دخول آمن</button>
  <small>استخدم نفس كلمة السر على الجهازين. لا ترسلها داخل المحادثة.</small>
  <div id="error"></div>
</div>

<div class="chat hidden" id="chat">
  <header>
    <div>
      <strong>Private Gate 🔐</strong>
      <span id="status">غير متصل</span>
      <span id="room"></span>
    </div>
    <button id="logout" class="ghost">خروج</button>
  </header>
  <main id="messages"></main>
  <form id="sendForm">
    <input id="text" autocomplete="off" placeholder="اكتب رسالتك المشفرة..." maxlength="4000">
    <button type="submit">إرسال ↗</button>
  </form>
</div>

<script>
const SALT = "private-gate-salt-v1";
const $ = s => document.querySelector(s);
const loginEl = $("#login"), chatEl = $("#chat"), nameEl = $("#name"), secretEl = $("#secret");
const enterBtn = $("#enter"), statusEl = $("#status"), roomEl = $("#room"), messagesEl = $("#messages");
const textEl = $("#text"), sendForm = $("#sendForm"), errorEl = $("#error"), logoutBtn = $("#logout");
let peer=null, conn=null, aesKey=null, myName="", roomId="";

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function ab(b64s){const bin=atob(b64s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
async function shaRoom(secret){const h=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret));return "pg-"+Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,20);}
async function deriveKey(secret){const mat=await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2", salt:new TextEncoder().encode(SALT), iterations:100000, hash:"SHA-256"}, mat, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);}
async function encrypt(txt){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM", iv}, aesKey, new TextEncoder().encode(txt));return {iv:b64(iv), data:b64(c)};}
async function decrypt(p){const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:ab(p.iv)}, aesKey, ab(p.data));return new TextDecoder().decode(pt);}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function addMsg(text, who="other", name=""){const div=document.createElement("div");div.className=`msg ${who}`;const time=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});if(who!=="system"){div.innerHTML=`<div class="meta"><span>${esc(name||(who==="me"?myName:"الطرف الآخر"))}</span><span>${time}</span></div>${esc(text)}`;}else{div.textContent=text;}messagesEl.appendChild(div);messagesEl.scrollTop=messagesEl.scrollHeight;}
function setStatus(t, online=false){statusEl.textContent=t;statusEl.className=online?"online":"";}
async function connectAsHost(room){return new Promise((res, rej)=>{const p=new Peer(room);peer=p;p.on("open", ()=>{ setStatus("في انتظار الطرف الآخر..."); roomEl.textContent=room; res({role:"host"}); });p.on("connection", c=>{ setupConn(c); });p.on("error", e=>{if(e.type==="unavailable-id"){p.destroy();connectAsClient(room).then(res).catch(rej);}else{rej(e);}});});}
async function connectAsClient(room){return new Promise((res, rej)=>{const p=new Peer();peer=p;p.on("open", ()=>{const c=p.connect(room,{reliable:true});setupConn(c);c.on("open", ()=>res({role:"client"}));setTimeout(()=>{ if(!conn||!conn.open) rej(new Error("لا يوجد طرف آخر بعد - تأكد أن الجهاز الأول دخل بنفس كلمة السر")); },5000);});p.on("error", rej);});}
function setupConn(c){conn=c;c.on("open", ()=>{setStatus("متصل • مشفر 🔒", true);try{c.send({type:"hello", name:myName});}catch{}addMsg(`تم ربط القناة المشفرة P2P`, "system");});c.on("data", async d=>{if(d?.type==="hello"){addMsg(`انضم ${d.name}`, "system");return;}if(!d?.iv) return;try{const plain=await decrypt(d);addMsg(plain, "other", d.senderName||"");}catch{addMsg("رسالة غير قابلة للفك - كلمة السر مختلفة؟", "system");}});c.on("close", ()=>{setStatus("انقطع الاتصال");addMsg("انقطع الاتصال - أعد الدخول لإعادة الربط", "system");});}
$("#toggleSecret").onclick=()=>{ secretEl.type=secretEl.type==="password"?"text":"password"; };
enterBtn.onclick=async()=>{const name=nameEl.value.trim(), secret=secretEl.value.trim();if(name.length<2){ errorEl.textContent="الاسم قصير جداً"; return; }if(secret.length<4){ errorEl.textContent="كلمة السر 4 أحرف على الأقل"; return; }enterBtn.disabled=true; enterBtn.textContent="جاري التشفير...";try{myName=name;aesKey=await deriveKey(secret);roomId=await shaRoom(secret);loginEl.classList.add("hidden");chatEl.classList.remove("hidden");setStatus("جاري إنشاء الغرفة...");await connectAsHost(roomId);}catch(e){console.error(e);errorEl.textContent=e.message||"فشل الاتصال";loginEl.classList.remove("hidden");chatEl.classList.add("hidden");}finally{enterBtn.disabled=false;enterBtn.textContent="دخول آمن";}};
sendForm.onsubmit=async(e)=>{e.preventDefault();const t=textEl.value.trim();if(!t||!conn||!conn.open) return;const payload=await encrypt(t);payload.senderName=myName;try{conn.send(payload);addMsg(t, "me", myName);textEl.value="";}catch{addMsg("فشل الإرسال", "system");}};
logoutBtn.onclick=()=>{try{conn?.close();peer?.destroy();}catch{}location.reload();};
</script>
</body>
</html>
